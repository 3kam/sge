<div
  style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: 12px; color: var(--text-secondary);">
  <span style="display: flex; align-items: center; gap: 4px;"><span
      style="width: 10px; height: 10px; border-radius: 2px; background: #d03b3b;"></span>Critical</span>
  <span style="display: flex; align-items: center; gap: 4px;"><span
      style="width: 10px; height: 10px; border-radius: 2px; background: #fab219;"></span>Needs work</span>
  <span style="display: flex; align-items: center; gap: 4px;"><span
      style="width: 10px; height: 10px; border-radius: 2px; background: #0ca30c;"></span>Strong</span>
  <span style="display: flex; align-items: center; gap: 4px; margin-left: auto;"><span
      style="width: 10px; height: 10px; border-radius: 2px; background: #4285f4;"></span>Target Goal</span>
</div>
<div style="position: relative; width: 100%; height: 400px;">
  <canvas id="rankChart" role="img"
    aria-label="Horizontal bar chart comparing current vs target percentiles across subjects."></canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const gridColor = isDark ? '#2c2c2a' : '#e1e0d9';
  const tickColor = isDark ? '#ffffff' : '#0b0b0b';
  const mutedColor = '#898781';

  // Formatted rank labels
  const currentRanks = ['34 / 35', '23 / 26', '70 / 98', '180 / 276', '13 / 20', '7–22 / 198'];
  const targetRanks = ['~20 / 35', '10 / 26', '40 / 98', '80 / 276', '6–8 / 20', 'Top 5 / 198'];

  new Chart(document.getElementById('rankChart'), {
    type: 'bar',
    data: {
      labels: ['Engineering Studies', 'Software Engineering', 'Physics', 'English Standard', 'Enterprise Computing', 'Mathematics Standard 2'],
      datasets: [
        {
          label: 'Current',
          data: [3, 12, 29, 35, 35, 93],
          backgroundColor: ['#d03b3b', '#d03b3b', '#fab219', '#fab219', '#fab219', '#0ca30c'],
          borderRadius: 4,
          barThickness: 16
        },
        {
          label: 'Target',
          data: [42, 61, 59, 71, 65, 97],
          backgroundColor: '#4285f4',
          borderRadius: 4,
          barThickness: 16
        }
      ]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              if (ctx.dataset.label === 'Current') {
                return 'Current: Rank ' + currentRanks[ctx.dataIndex] + '  •  ' + ctx.parsed.x + 'th percentile';
              }
              return 'Target: Rank ' + targetRanks[ctx.dataIndex] + '  •  ' + ctx.parsed.x + 'th percentile';
            }
          }
        }
      },
      scales: {
        x: {
          min: 0,
          max: 100,
          title: { display: true, text: 'Class rank percentile (higher = stronger)', color: mutedColor, font: { size: 12 } },
          grid: { color: gridColor },
          ticks: { color: mutedColor, stepSize: 25 }
        },
        y: {
          grid: { display: false },
          ticks: { color: tickColor, font: { size: 13 } }
        }
      }
    }
  });
</script>
